# Builds the setup tool executables when a tag starting with `v` is pushed, and uploads them to a GitHub release.
# A tag with `-` in it (like `v0.1.0-rc.1`) makes a pre-release, so the `releases/latest` link skips it.
#
# The setup tool deploys the commit it was built from to Vercel.
# This workflow stamps this repository's address (`GITHUB_REPOSITORY`) into each executable (`stampedVercelDeployRepoURL` in `tools/setup`).
# Go stamps the commit it builds from into each executable (`vcs.revision`), which is the tagged commit (`GITHUB_SHA`, also for an annotated tag, measured).
# So a fork that pushes a tag gets executables that deploy the fork to Vercel.
#
# This is the code repository's own workflow.
# It is not the auto sync workflow that the setup tool installs in the DB repository (`syncWorkflowContent`).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # To create the release

env:
  TARGETS: windows/amd64 # Targets to build, as GOOS/GOARCH separated by spaces. Only targets that were tested by hand

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          ldflags="-s -w -X main.stampedVercelDeployRepoURL=https://github.com/${GITHUB_REPOSITORY}"
          expected="https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}" # The address the tool prints before it starts (`buildTreeURL`)

          # Runs a Linux build with the same flags in an empty folder without git, and checks the address of the code it would deploy to Vercel.
          # `-X` does nothing, without an error, if the variable name is wrong, and this catches it.
          # The GitHub address points nowhere, so the tool stops right after it prints that address
          go build -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/setup-check" ./tools/setup
          check_dir="$(mktemp -d)"
          (cd "$check_dir" && STARKIVE_GH_API_URL=http://127.0.0.1:9 "$RUNNER_TEMP/setup-check" -headless < /dev/null > out.txt 2>&1 || true)
          cat "$check_dir/out.txt"
          grep -qF "$expected" "$check_dir/out.txt"

          mkdir dist
          for target in $TARGETS; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            out="dist/starkive-setup_${os}_${arch}${ext}"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$out" ./tools/setup
            # Check the commit Go stamped into this executable: the tagged commit, built without changes
            info="$(go version -m "$out")"
            revision="$(sed -n 's/.*vcs\.revision=//p' <<< "$info")"
            modified="$(sed -n 's/.*vcs\.modified=//p' <<< "$info")"
            if [ "$revision" != "$GITHUB_SHA" ] || [ "$modified" != false ]; then
              echo "$out: vcs.revision=$revision vcs.modified=$modified, want $GITHUB_SHA and false"
              exit 1
            fi
          done
          cd dist && sha256sum * > SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $prerelease

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Starkive</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23e3b341' d='M8 .8l2.2 4.6 5 .7-3.6 3.5.9 5L8 12.2 3.5 14.6l.9-5L.8 6.1l5-.7z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Starkive</h1>
    <!-- Menus shown only after sign-in (`app.js` removes `hidden`). `app.js` adds the icons (`data-icon`) and the open and close handling (`bindMenu`) -->
    <div id="add-menu" class="menu" hidden>
      <button type="button" class="ghost menu-button" aria-haspopup="menu" aria-expanded="false" aria-label="Add" title="Add"><span data-icon="plus"></span><span data-icon="triangleDown"></span></button>
      <div class="menu-list" role="menu" hidden>
        <button id="add-button" type="button" role="menuitem"><span data-icon="repo"></span>Add new repository</button>
        <button id="import-button" type="button" role="menuitem"><span data-icon="star"></span>Import stars from GitHub</button>
      </div>
    </div>
    <!-- If auto sync has a problem to report (`syncProblem`), the account button and Settings get a warning mark (`attention`) -->
    <div id="account-menu" class="menu" hidden>
      <button id="account-button" type="button" class="menu-button account-button" aria-haspopup="menu" aria-expanded="false" aria-label="Account" title="Account"><span data-icon="person"></span></button>
      <div class="menu-list" role="menu" hidden>
        <p id="account-username" class="menu-header" role="none"></p>
        <a id="profile-link" role="menuitem" target="_blank" rel="noopener noreferrer"><span data-icon="person"></span>Your GitHub profile</a>
        <!-- Opens the DB repository on GitHub. `app.js` fills in the address and the repository name after sign-in -->
        <a id="repo-link" role="menuitem" target="_blank" rel="noopener noreferrer"><span data-icon="repo"></span><span class="menu-item-text">Archive repository<span id="repo-name" class="menu-item-detail"></span></span></a>
        <!-- Auto sync settings and status, Sync now, the bookmarklet -->
        <button id="settings-button" type="button" role="menuitem"><span data-icon="gear"></span>Settings</button>
        <hr>
        <button id="logout" type="button" role="menuitem"><span data-icon="signOut"></span>Sign out</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Sign-in screen. The user signs in with a GitHub account, without a password. Only the one GitHub account the server allows can get in -->
    <section id="login" class="panel" hidden>
      <h2>Sign in</h2>
      <p class="panel-note">Only the GitHub account set up for this dashboard can sign in.</p>
      <div class="actions">
        <button id="login-button" type="button">Sign in with GitHub</button>
      </div>
    </section>

    <section id="dashboard" class="layout" hidden>
      <nav id="sidebar" class="sidebar" aria-label="Lists"></nav>

      <div class="content">
        <div id="list-header" class="list-header"></div>


        <div class="filters">
          <input id="search" type="search" placeholder="Search name, description, note, topics  /" spellcheck="false">
          <select id="language" aria-label="Language"></select>
          <select id="sort" aria-label="Sort">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="name">Name</option>
          </select>
        </div>

        <div class="summary">
          <span id="summary"></span>
          <button id="reload" type="button" class="icon-button" aria-label="Reload" title="Reload"><span data-icon="sync"></span></button>
        </div>

        <div id="list" class="list"></div>
        <button id="more" type="button" class="ghost more" hidden></button>
      </div>
    </section>
  </main>

  <div id="status" class="status" role="status" aria-live="polite"></div>
</body>
</html>
